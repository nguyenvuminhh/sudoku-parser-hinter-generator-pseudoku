name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Check the additional 20 Advanced 8+ puzzles
        run: npx playwright test advanced-benchmark --project=chromium
        env:
          HINT_BENCHMARK_FIXTURE: ../tests/fixtures/advanced-8-plus-additional-20.json
